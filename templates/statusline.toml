"$schema" = 'https://starship.rs/config-schema.json'

# Claude Code status bar rendered by Starship, laid out like the oh-my-posh one.
# The binary packs the visible segments of each line into numbered slots
# (CC_L<line>_<slot>) and sets one CC_L<line>_END<n> for the last slot used, so
# the rounded end cap always takes that slot's color.
# Glyphs are written as \u escapes: U+E0B6 start cap, U+E0B0 arrow, U+E0B4 end
# cap, U+F07B folder. Keep them escaped; raw Nerd Font glyphs get lost in edits.
add_newline = false
palette = '{{THEME}}'

format = """
[\ue0b6](fg:l1_1)\
${env_var.CC_L1_1}${env_var.CC_L1_2}${env_var.CC_L1_3}${env_var.CC_L1_4}\
${env_var.CC_L1_END1}${env_var.CC_L1_END2}${env_var.CC_L1_END3}${env_var.CC_L1_END4}\
$line_break\
[\ue0b6](fg:l2_1)$directory${env_var.CC_L2_2}${env_var.CC_L2_3}\
${env_var.CC_L2_END1}${env_var.CC_L2_END2}${env_var.CC_L2_END3}\
$line_break\
[\ue0b6](fg:l3_1)\
${env_var.CC_L3_1}${env_var.CC_L3_2}${env_var.CC_L3_3}${env_var.CC_L3_4}\
${env_var.CC_L3_END1}${env_var.CC_L3_END2}${env_var.CC_L3_END3}${env_var.CC_L3_END4}"""

{{PALETTE}}

# Line 1: model, effort, version, account
[env_var.CC_L1_1]
format = "[ $env_value ](fg:f1_1 bg:l1_1)"

[env_var.CC_L1_2]
format = "[\ue0b0](fg:l1_1 bg:l1_2)[ $env_value ](fg:f1_2 bg:l1_2)"

[env_var.CC_L1_3]
format = "[\ue0b0](fg:l1_2 bg:l1_3)[ $env_value ](fg:f1_3 bg:l1_3)"

[env_var.CC_L1_4]
format = "[\ue0b0](fg:l1_3 bg:l1_4)[ $env_value ](fg:f1_4 bg:l1_4)"

[env_var.CC_L1_END1]
format = "[\ue0b4](fg:l1_1)"

[env_var.CC_L1_END2]
format = "[\ue0b4](fg:l1_2)"

[env_var.CC_L1_END3]
format = "[\ue0b4](fg:l1_3)"

[env_var.CC_L1_END4]
format = "[\ue0b4](fg:l1_4)"

# Line 2: directory, branch or worktree, lines changed and session time
[directory]
format = "[ \uf07b $path ](fg:f2_1 bg:l2_1)[$read_only](fg:f2_1 bg:l2_1)"
truncation_length = 3
truncate_to_repo = false
truncation_symbol = '…/'

[env_var.CC_L2_2]
format = "[\ue0b0](fg:l2_1 bg:l2_2)[ $env_value ](fg:f2_2 bg:l2_2)"

[env_var.CC_L2_3]
format = "[\ue0b0](fg:l2_2 bg:l2_3)[ $env_value ](fg:f2_3 bg:l2_3)"

[env_var.CC_L2_END1]
format = "[\ue0b4](fg:l2_1)"

[env_var.CC_L2_END2]
format = "[\ue0b4](fg:l2_2)"

[env_var.CC_L2_END3]
format = "[\ue0b4](fg:l2_3)"

# Line 3: context, prompt cache timer, 5h and 7d rate limits
[env_var.CC_L3_1]
format = "[ $env_value ](fg:f3_1 bg:l3_1)"

[env_var.CC_L3_2]
format = "[\ue0b0](fg:l3_1 bg:l3_2)[ $env_value ](fg:f3_2 bg:l3_2)"

[env_var.CC_L3_3]
format = "[\ue0b0](fg:l3_2 bg:l3_3)[ $env_value ](fg:f3_3 bg:l3_3)"

[env_var.CC_L3_4]
format = "[\ue0b0](fg:l3_3 bg:l3_4)[ $env_value ](fg:f3_4 bg:l3_4)"

[env_var.CC_L3_END1]
format = "[\ue0b4](fg:l3_1)"

[env_var.CC_L3_END2]
format = "[\ue0b4](fg:l3_2)"

[env_var.CC_L3_END3]
format = "[\ue0b4](fg:l3_3)"

[env_var.CC_L3_END4]
format = "[\ue0b4](fg:l3_4)"
