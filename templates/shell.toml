"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:s1_bg)\
$os\
$username\
[](bg:s2_bg fg:s1_bg)\
$directory\
[](fg:s2_bg bg:s3_bg)\
$git_branch\
$git_status\
[](fg:s3_bg bg:s4_bg)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:s4_bg bg:s5_bg)\
$docker_context\
$conda\
$pixi{{USAGE}}\
[](fg:s5_bg bg:s6_bg)\
$cmd_duration\
$status\
[ ](fg:s6_bg)\
$line_break$character"""

palette = '{{THEME}}'

{{PALETTE}}

[os]
disabled = false
style = "bg:s1_bg fg:s1_fg"

[os.symbols]
Windows = "󰍲 "
Ubuntu = "󰕈 "
SUSE = " "
Raspbian = "󰐿 "
Mint = "󰣭 "
Macos = "󰀵 "
Manjaro = " "
Linux = "󰌽 "
Gentoo = "󰣨 "
Fedora = "󰣛 "
Alpine = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = "󰣇 "
Artix = "󰣇 "
EndeavourOS = " "
CentOS = " "
Debian = "󰣚 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
Pop = " "

[username]
show_always = true
style_user = "bg:s1_bg fg:s1_fg"
style_root = "bg:s1_bg fg:s1_fg"
format = '[$user ]($style)'

[directory]
style = "fg:s2_fg bg:s2_bg"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋"

[git_branch]
symbol = ""
style = "bg:s3_bg"
format = '[[ $symbol $branch ](fg:s3_fg bg:s3_bg)]($style)'

[git_status]
style = "bg:s3_bg"
format = '[[($all_status$ahead_behind )](fg:s3_fg bg:s3_bg)]($style)'

[nodejs]
symbol = ""
style = "bg:s4_bg"
format = '[[ $symbol( $version) ](fg:s4_fg bg:s4_bg)]($style)'

[bun]
symbol = ""
style = "bg:s4_bg"
format = '[[ $symbol( $version) ](fg:s4_fg bg:s4_bg)]($style)'

[c]
symbol = " "
style = "bg:s4_bg"
format = '[[ $symbol( $version) ](fg:s4_fg bg:s4_bg)]($style)'

[cpp]
symbol = " "
style = "bg:s4_bg"
format = '[[ $symbol( $version) ](fg:s4_fg bg:s4_bg)]($style)'

[rust]
symbol = ""
style = "bg:s4_bg"
format = '[[ $symbol( $version) ](fg:s4_fg bg:s4_bg)]($style)'

[golang]
symbol = ""
style = "bg:s4_bg"
format = '[[ $symbol( $version) ](fg:s4_fg bg:s4_bg)]($style)'

[php]
symbol = ""
style = "bg:s4_bg"
format = '[[ $symbol( $version) ](fg:s4_fg bg:s4_bg)]($style)'

[java]
symbol = ""
style = "bg:s4_bg"
format = '[[ $symbol( $version) ](fg:s4_fg bg:s4_bg)]($style)'

[jj_bookmark]
symbol = ""
style = "bg:s3_bg"
format = '[[ $symbol $bookmark(@$remote)$diverged( \\(+$overflow_count others\\)) ](fg:s3_fg bg:s3_bg)]($style)'

[jj_status]
style = "bg:s3_bg"
format = '[[($all )](fg:s3_fg bg:s3_bg)]($style)'

[kotlin]
symbol = ""
style = "bg:s4_bg"
format = '[[ $symbol( $version) ](fg:s4_fg bg:s4_bg)]($style)'

[haskell]
symbol = ""
style = "bg:s4_bg"
format = '[[ $symbol( $version) ](fg:s4_fg bg:s4_bg)]($style)'

[python]
symbol = ""
style = "bg:s4_bg"
format = '[[ $symbol( $version) ](fg:s4_fg bg:s4_bg)]($style)'

[docker_context]
symbol = ""
style = "bg:s5_bg"
format = '[[ $symbol( $context) ](fg:#83a598 bg:s5_bg)]($style)'

[conda]
style = "bg:s5_bg"
format = '[[ $symbol( $environment) ](fg:#83a598 bg:s5_bg)]($style)'

[pixi]
style = "bg:s5_bg"
format = '[[ $symbol( $version)( $environment) ](fg:s5_fg bg:s5_bg)]($style)'

[cmd_duration]
min_time = 2000
style = "bg:s6_bg"
format = '[[ 󱦠 $duration ](fg:s6_fg bg:s6_bg)]($style)'

[status]
disabled = false
symbol = "✘"
style = "bg:s6_bg"
format = '[[ $symbol $status ](fg:color_red bg:s6_bg)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_green)'
error_symbol = '[](bold fg:color_red)'
vimcmd_symbol = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol = '[](bold fg:color_purple)'
vimcmd_visual_symbol = '[](bold fg:color_yellow)'

# Claude Code 5h/7d usage, saved by the status bar. Starship runs the
# installed binary directly (two-element shell: no extra shell, no args added);
# empty output hides the group.
[custom.claude]
when = true
shell = ['{{BIN}}', 'usage']
command = 'usage'
format = '([ $output ](fg:s5_fg bg:s5_bg))'
